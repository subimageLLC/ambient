name     = "clock"
mode     = "interactive"
entry    = "clock.py"
setup    = "setup.sh"
needs    = ["python3", "network"]
glyphs   = "blocks"
reads    = ["~/.config/ambient/screens/clock.conf", "~/.cache/ambient/fetch/weather.json"]
contacts = ["wttr.in"]

# keys: s set location (zipcode/city/lat,lon) · q quits the pane
