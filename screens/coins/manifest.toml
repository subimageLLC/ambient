name     = "coins"
mode     = "interactive"
entry    = "coins.py"
needs    = ["python3", "network"]
glyphs   = "braille"
reads    = ["~/.config/ambient/screens/coins.conf", "~/.cache/ambient/screen-coins*"]
contacts = ["api.coingecko.com"]
keys     = [
  "↑/↓ or j,k   select coin",
  "a            pick coins (add/remove from catalog)",
  "x            remove selected coin",
  "tab / d w m y  timeframe: day week month year",
  "r            force refresh",
  "q            quit pane",
]

# first run opens a portfolio picker over a verified popular-coin catalog.
