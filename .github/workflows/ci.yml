name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: install test deps (tmux, shellcheck)
        run: |
          if [ "$(uname)" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux shellcheck
          else
            brew install tmux shellcheck
          fi
      - name: lint, test, smoke (headless session against the real screens)
        run: make check
