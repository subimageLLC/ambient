name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o bin/ambient .
      - name: smoke test (headless session)
        run: |
          sudo apt-get install -y tmux || brew install tmux || true
          export AMBIENT_CONFIG_DIR=$PWD/.smoke-config AMBIENT_DATA_DIR=$PWD/.smoke-data AMBIENT_CACHE_DIR=$PWD/.smoke-cache
          mkdir -p $AMBIENT_CONFIG_DIR
          printf 'screens = ["clock"]\nrotation_secs = 5\n' > $AMBIENT_CONFIG_DIR/ambient.toml
          ./bin/ambient start -d --no-rotate
          sleep 3
          tmux capture-pane -t ambient:clock -p | grep -q "$(date +%a)" && echo "clock pane rendered"
          tmux kill-session -t ambient
