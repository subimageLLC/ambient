version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
    gobinaries: {}

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^readme:"
      - "^gitignore:"
      - "^test:"

brews:
  - name: ambient
    repository:
      owner: subimageLLC
      name: homebrew-tap
    description: "Rotating terminal dashboard: time, weather, net, crypto, system, events — any unix, no daemon"
    homepage: "https://github.com/subimageLLC/ambient"
    license: "MIT"
    dependencies:
      - tmux
      - jq
      - toilet
      - gping
      - python@3
      - btop
    install: |
      bin.install "ambient"
    test: |
      assert_match "ambient", shell_output("#{bin}/ambient version")
