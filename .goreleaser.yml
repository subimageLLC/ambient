version: 2
builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: "-s -w -X main.version={{ .Version }}"
archives:
  - files: [README.md, LICENSE, DESIGN.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:"]
